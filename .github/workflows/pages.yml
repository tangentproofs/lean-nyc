name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with the member-project submodules, pinned)
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build every explainer (no Lean build; declarations are scanned from source text)
        run: |
          python3 -m pip install --quiet pyyaml
          (cd engine && npm ci)
          for s in sites/*/site.json; do
            [ -e "$s" ] || continue
            slug=$(basename "$(dirname "$s")")
            engine/build.sh "$slug"
          done

      - name: Assemble the Pages site
        # Only built output is published. Submodule source is never copied wholesale: an explainer
        # reproduces Lean (under src/) only when its project's licence permits it (engine/gen.py).
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
